apiVersion: 1
datasources:
  - name: Telemetry ClickHouse
    uid: telemetry-clickhouse
    version: 2
    type: grafana-clickhouse-datasource
    access: proxy
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: grafana_reader
      defaultDatabase: telemetry
      dialTimeout: "10"
      queryTimeout: "30"
      customSettings:
        - setting: max_execution_time
          value: "30"
    secureJsonData:
      password: $CLICKHOUSE_READ_PASSWORD
